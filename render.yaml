# One-click deploy on Render: New + > Blueprint > select this GitHub repo.
services:
  - type: web
    name: clinicflow-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: AI_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CLINIC_NAME
        value: Robina 7 Day Doctors
